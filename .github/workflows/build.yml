name: Build
on: [ workflow_dispatch, push ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200
      - uses: actions/cache@v5
        with:
          path: "**/.gradle/loom-cache"
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/libs.versions.*', '**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v5
      - run: chmod +x ./gradlew
      - run: ./gradlew build publishToMavenLocal --stacktrace
        env:
          USERNAME: ${{ secrets.USERNAME }}
          READ_PACKAGES_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}
      - run: |
          minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          echo "minecraft_version=$minecraft_version" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: SophisticatedBackpacks-${{ env.minecraft_version }}
          path: build/libs
      - uses: actions/upload-artifact@v7
        with:
          name: Maven Local SophisticatedBackpacks-${{ env.minecraft_version }}
          path: ~/.m2/repository/sophisticatedbackpacks

#  server_test:
